services:
  postgres:
    image: postgres:17-alpine
    container_name: biblioteca-db
    environment:
      POSTGRES_DB: ${DB_NAME:-biblioteca}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-biblioteca}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biblioteca-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: biblioteca-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@biblioteca.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - biblioteca-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  biblioteca-network:
    driver: bridge
