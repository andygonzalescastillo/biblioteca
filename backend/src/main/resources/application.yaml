server:
  port: ${PORT:8080}

spring:
  application:
    name: backend
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# --- Swagger Config ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# --- App Config ---
app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  upload-dir: ${APP_UPLOAD_DIR:${user.dir}/uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  prestamo:
    dias-default: ${APP_PRESTAMO_DIAS_DEFAULT:7}
    dias-minimo: ${APP_PRESTAMO_DIAS_MINIMO:1}
    dias-maximo: ${APP_PRESTAMO_DIAS_MAXIMO:30}
    cantidad-reserva-maxima: ${APP_PRESTAMO_CANTIDAD_RESERVA_MAXIMA:2}
    max-libros-prestados-concurrentes: ${APP_PRESTAMO_MAX_CONCURRENTES:10}
