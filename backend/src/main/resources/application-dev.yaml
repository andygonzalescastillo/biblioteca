spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:biblioteca}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      idle-timeout: 30000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: true

logging:
  level:
    com.biblioteca.backend: DEBUG
