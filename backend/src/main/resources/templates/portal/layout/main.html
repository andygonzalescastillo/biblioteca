<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="page(titulo, contenido)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Portal de Lectores - Consulta y reserva libros del catálogo de la Biblioteca Digital en tiempo real.">
  <meta name="keywords" content="biblioteca, libros, préstamos, catálogo, lectores, reserva" />
  <meta name="author" content="Andy Gonzales" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Portal de Lectores | Biblioteca Digital" />
  <meta property="og:description" content="Consulta y reserva libros del catálogo de la Biblioteca Digital en tiempo real." />
  <meta property="og:image" content="/favicon.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Portal de Lectores | Biblioteca Digital" />
  <meta property="twitter:description" content="Consulta y reserva libros del catálogo de la Biblioteca Digital en tiempo real." />
  <meta property="twitter:image" content="/favicon.png" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <title th:text="${titulo} + ' | Portal de Lectores'">Portal de Lectores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    (() => {
      const theme = localStorage.getItem('portal-theme') || 'dark';
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-stone-50 text-stone-950 min-h-screen">

  <div class="flex flex-col min-h-screen">

    <header class="sticky top-0 z-30 border-b border-stone-200 bg-stone-50/75 backdrop-blur-xl">
      <div class="mx-auto max-w-7xl px-4 flex items-center justify-between py-4">

        <a th:href="@{/portal}" class="flex items-center gap-3 group" aria-label="Inicio - Portal de Lectores">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-stone-950 font-bold text-white shadow-sm transition-transform duration-300 group-hover:scale-105"
               aria-hidden="true">
            <i data-lucide="book-marked" class="h-6 w-6 text-white"></i>
          </div>
          <div>
            <p class="text-sm font-bold tracking-tight bg-gradient-to-r from-stone-950 to-indigo-600 dark:from-white dark:to-indigo-400 bg-clip-text text-transparent">Biblioteca</p>
            <p class="text-xs text-stone-500 font-medium">Portal de Lectores</p>
          </div>
        </a>

        <button type="button"
                id="btn-menu-mobile"
                aria-controls="menu-mobile"
                aria-expanded="false"
                class="rounded-xl border border-stone-200 bg-white px-3 py-2 text-sm font-bold text-stone-700 lg:hidden">
          Menú
        </button>

        <nav aria-label="Navegación principal" class="hidden lg:flex items-center gap-2">
          <a th:href="@{/portal/catalogo}"
             class="rounded-xl px-3 py-2 text-sm font-semibold text-stone-500 transition hover:bg-stone-100 hover:text-stone-950">
            Catálogo
          </a>

          <button th:if="${lector != null}"
                  type="button"
                  id="btn-abrir-carrito"
                  aria-haspopup="dialog"
                  class="rounded-xl px-3 py-2 text-sm font-semibold text-stone-500 transition hover:bg-stone-100 hover:text-stone-950 flex items-center gap-1.5">
            Carrito
            <span id="carrito-badge"
                  th:classappend="${(carritoCantidad == null or carritoCantidad == 0) ? 'hidden' : ''}"
                  th:text="${carritoCantidad != null ? carritoCantidad : 0}"
                  aria-label="Libros en el carrito"
                  class="inline-flex min-w-[20px] h-5 items-center justify-center rounded-full bg-stone-950 px-1.5 text-xs font-bold text-white">
              0
            </span>
          </button>

          <a th:href="@{/portal/mis-prestamos}"
             class="rounded-xl px-3 py-2 text-sm font-semibold text-stone-500 transition hover:bg-stone-100 hover:text-stone-950">
            Mis préstamos
          </a>

          <div th:if="${lector != null}"
               class="inline-flex items-center gap-2 rounded-xl border border-stone-200 bg-white px-3 py-2 text-sm font-bold text-stone-700">
            <span class="text-xs font-semibold text-stone-500">Cupo libre</span>
            <span id="cupo-libre-badge"
                  th:data-base-cupo="${cupoPrestamo != null ? cupoPrestamo.cupoDisponible() : (cupoDisponiblePrestamo != null ? cupoDisponiblePrestamo + (carritoCantidad != null ? carritoCantidad : 0) : 5)}"
                  th:text="${cupoDisponiblePrestamo != null ? cupoDisponiblePrestamo : 0}"
                  class="text-sm font-bold text-stone-950">
              0
            </span>
          </div>

          <button type="button"
                  data-theme-toggle
                  aria-label="Cambiar tema"
                  aria-pressed="true"
                  class="inline-flex items-center gap-2 rounded-xl border border-stone-200 bg-white px-3 py-2 text-sm font-bold text-stone-700 transition hover:bg-stone-100 hover:text-stone-950">
            <i data-theme-icon data-lucide="sun" class="h-4 w-4"></i>
            <span data-theme-label>Claro</span>
          </button>

          <form th:if="${lector != null}" th:action="@{/portal/logout}" method="post">
            <button class="inline-flex items-center gap-2 rounded-xl border border-stone-200 bg-white px-4 py-2 text-sm font-bold text-stone-700 transition hover:border-indigo-600/30 hover:bg-indigo-600/10 hover:text-indigo-700">
              Cerrar sesión
            </button>
          </form>

          <a th:if="${lector == null}"
             th:href="@{/portal/login}"
             class="inline-flex items-center justify-center gap-2 rounded-xl bg-stone-950 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-stone-800 hover:shadow-md">
            Ingresar
          </a>
        </nav>
      </div>

      <nav id="menu-mobile"
           aria-label="Navegación móvil"
           class="hidden border-t border-stone-200 px-4 py-3 flex-col gap-2">
        <a th:href="@{/portal/catalogo}"
           class="block rounded-xl px-3 py-2 text-sm font-semibold text-stone-500 transition hover:bg-stone-100 hover:text-stone-950">
          Catálogo
        </a>

        <button th:if="${lector != null}"
                type="button"
                id="btn-abrir-carrito-mobile"
                class="w-full text-left rounded-xl px-3 py-2 text-sm font-semibold text-stone-500 transition hover:bg-stone-100 hover:text-stone-950 flex items-center justify-between">
          <span>Carrito</span>
          <span id="carrito-badge-mobile"
                th:classappend="${(carritoCantidad == null or carritoCantidad == 0) ? 'hidden' : ''}"
                th:text="${carritoCantidad != null ? carritoCantidad : 0}"
                class="inline-flex min-w-[20px] h-5 items-center justify-center rounded-full bg-stone-950 px-1.5 text-xs font-bold text-white">
            0
          </span>
        </button>

        <a th:href="@{/portal/mis-prestamos}"
           class="block rounded-xl px-3 py-2 text-sm font-semibold text-stone-500 transition hover:bg-stone-100 hover:text-stone-950">
          Mis préstamos
        </a>

        <div th:if="${lector != null}"
             class="flex items-center justify-between rounded-xl border border-stone-200 bg-white px-3 py-2 text-sm font-bold text-stone-700">
          <span>Cupo libre</span>
          <span id="cupo-libre-badge-mobile"
                th:data-base-cupo="${cupoPrestamo != null ? cupoPrestamo.cupoDisponible() : (cupoDisponiblePrestamo != null ? cupoDisponiblePrestamo + (carritoCantidad != null ? carritoCantidad : 0) : 5)}"
                th:text="${cupoDisponiblePrestamo != null ? cupoDisponiblePrestamo : 0}"
                class="text-sm font-bold text-stone-950">
            0
          </span>
        </div>

        <button type="button"
                data-theme-toggle
                aria-label="Cambiar tema"
                aria-pressed="true"
                class="w-full inline-flex items-center justify-between rounded-xl border border-stone-200 bg-white px-3 py-2 text-sm font-bold text-stone-700 transition hover:bg-stone-100 hover:text-stone-950">
          <span data-theme-label>Claro</span>
          <i data-theme-icon data-lucide="sun" class="h-4 w-4"></i>
        </button>

        <form th:if="${lector != null}" th:action="@{/portal/logout}" method="post">
          <button class="w-full inline-flex items-center justify-center gap-2 rounded-xl border border-stone-200 bg-white px-4 py-2 text-sm font-bold text-stone-700 transition hover:border-indigo-600/30 hover:bg-indigo-600/10 hover:text-indigo-700">
            Cerrar sesión
          </button>
        </form>
      </nav>

    </header>

      <div th:if="${lector != null}" id="carrito-drawer" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-label="Carrito de préstamos">
        <button type="button"
                id="btn-cerrar-carrito-bg"
                class="absolute inset-0 bg-transparent"
                aria-label="Cerrar carrito">
        </button>

        <aside class="absolute right-0 top-0 flex h-screen w-full max-w-md flex-col border-l border-stone-200 bg-stone-50 p-6 shadow-lg transition-transform duration-300">
          <header class="flex items-start justify-between gap-4">
            <div>
              <p class="text-[11px] font-bold uppercase tracking-[0.22em] text-indigo-600">Carrito</p>
              <h2 class="mt-2 text-2xl font-bold text-stone-950">Préstamo en preparación</h2>
            </div>
            <button type="button"
                    id="btn-cerrar-carrito"
                    class="inline-flex items-center gap-2 rounded-xl border border-stone-200 bg-white px-4 py-2 text-sm font-bold text-stone-700 transition hover:border-indigo-600/30 hover:bg-indigo-600/10 hover:text-indigo-700">
              Cerrar
            </button>
          </header>

          <div class="mt-6 rounded-2xl border border-stone-200 bg-white p-4 flex items-center justify-between shadow-sm">
            <div>
              <p class="text-xs font-semibold text-stone-500 uppercase tracking-wider">Libros elegidos</p>
              <p class="mt-1 text-2xl font-bold text-stone-950">
                <span id="carrito-badge-drawer" th:text="${carritoCantidad != null ? carritoCantidad : 0}">0</span>
                <span class="text-xs font-bold text-stone-500 ml-1">libro(s)</span>
              </p>
            </div>
            <p class="text-xs text-stone-500 max-w-[200px] text-right">Agrega libros y confirma el préstamo al final.</p>
          </div>

          <div id="drawer-lista-libros"
               class="mt-6 flex-1 overflow-y-auto pr-1 space-y-3 max-h-[calc(100vh-320px)]">
            <th:block th:replace="~{portal/fragmentos/carrito-drawer :: lista}"></th:block>
          </div>

          <footer class="grid gap-3 pt-4 border-t border-stone-200 mt-4">
            <a th:href="@{/portal/carrito}"
               class="inline-flex items-center justify-center gap-2 rounded-xl bg-stone-950 px-5 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-stone-800">
              Revisar carrito
            </a>
            <a th:href="@{/portal/catalogo}"
               id="btn-seguir-buscando"
               class="inline-flex items-center justify-center gap-2 rounded-xl border border-stone-200 bg-white px-5 py-3 text-sm font-bold text-stone-700 transition hover:border-indigo-600/30 hover:bg-indigo-600/10 hover:text-indigo-700">
              Seguir buscando
            </a>
          </footer>
        </aside>
      </div>

    <main class="mx-auto max-w-7xl w-full px-4 py-8 flex-1">
      <div id="thymeleaf-mensaje" th:if="${mensaje}" th:data-message="${mensaje}" class="hidden" aria-hidden="true"></div>
      <div id="thymeleaf-error"   th:if="${error}"   th:data-error="${error}"     class="hidden" aria-hidden="true"></div>

      <th:block th:replace="${contenido}"></th:block>
    </main>

    <footer class="border-t border-stone-200 py-6 text-center text-xs text-stone-400">
      &copy; Biblioteca Digital — Portal de Lectores
    </footer>
  </div>

  <div id="toast-container"
       aria-live="polite"
       aria-atomic="false"
       class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 w-full max-w-sm px-4 sm:px-0 pointer-events-none">
  </div>

  <script type="module" th:src="@{/js/portal.js}"></script>
</body>
</html>
