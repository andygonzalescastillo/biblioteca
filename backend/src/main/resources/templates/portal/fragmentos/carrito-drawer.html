<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="lista">
  <div th:if="${librosCarrito == null or librosCarrito.empty}"
       class="flex flex-col items-center justify-center py-12 text-center text-stone-500">
    <i data-lucide="shopping-cart" class="h-10 w-10 text-stone-400 mb-2"></i>
    <p class="text-xs font-semibold">El carrito está vacío</p>
  </div>

  <div th:each="libro : ${librosCarrito}"
       data-libro-row
       th:data-libro-id="${libro.id}"
       class="flex items-center gap-3 rounded-xl border border-stone-200 bg-white p-2 hover:border-indigo-600/20 transition-all duration-300">
    <div class="w-12 shrink-0 overflow-hidden rounded-lg bg-stone-100 border border-stone-200 relative" style="padding-bottom: calc(12 * 1.5 * 0.25rem); height: 4.5rem;">
      <img th:if="${libro.portada != null}"
           th:src="${libro.portada.urlAlmacenamiento}"
           th:alt="${libro.titulo}"
           class="absolute inset-0 h-full w-full object-cover">
      <div th:if="${libro.portada == null}" class="absolute inset-0 flex items-center justify-center bg-gradient-to-b from-stone-100 to-stone-200" aria-hidden="true">
        <i data-lucide="book-open" class="h-5 w-5 text-stone-400"></i>
      </div>
    </div>
    <div class="min-w-0 flex-1">
      <p class="text-[9px] font-bold uppercase tracking-wider text-indigo-600"
         th:text="${libro.categoria.nombre}">Categoría</p>
      <h3 class="text-xs font-bold text-stone-950 truncate"
          th:text="${libro.titulo}">Título</h3>
      <p class="text-[10px] text-stone-500 truncate">
        <span th:each="autor, iter : ${libro.autores}"
              th:text="${autor.nombre} + (${iter.last} ? '' : ', ')">Autor</span>
      </p>
    </div>
    <div class="flex flex-col items-end gap-1.5 shrink-0">
      <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-600/10 text-indigo-600"
            th:text="${(cantidadesPorLibro[libro.id] ?: 0)} + ' ud.'">1 ud.</span>
      <div class="flex items-center gap-1">
        <form th:action="@{/portal/carrito/libros/{id}/reducir(id=${libro.id})}"
              method="post"
              class="form-carrito-ajax" data-action="reducir" data-context="drawer">
          <button type="submit"
                  th:disabled="${(cantidadesPorLibro[libro.id] ?: 0) <= 1}"
                  title="Reducir unidad"
                  class="inline-flex items-center justify-center h-6 w-6 rounded-lg border border-stone-200 text-stone-950 hover:bg-stone-100 disabled:opacity-30 disabled:pointer-events-none transition text-xs font-bold">
            −
          </button>
        </form>
        <form th:action="@{/portal/carrito/libros/{id}(id=${libro.id})}"
              method="post"
              class="form-carrito-ajax" data-action="agregar" data-context="drawer">
          <button type="submit"
                  th:disabled="${(cantidadesPorLibro[libro.id] ?: 0) >= cantidadReservaMaxima || (cantidadesPorLibro[libro.id] ?: 0) >= libro.stock}"
                  title="Agregar unidad"
                  class="inline-flex items-center justify-center h-6 w-6 rounded-lg border border-stone-200 text-stone-950 hover:bg-stone-100 disabled:opacity-30 disabled:pointer-events-none transition text-xs font-bold">
            +
          </button>
        </form>
        <form th:action="@{/portal/carrito/libros/{id}/quitar(id=${libro.id})}"
              method="post"
              class="form-carrito-ajax" data-action="quitar" data-context="drawer">
          <button type="submit"
                  title="Quitar del carrito"
                  class="inline-flex items-center justify-center h-6 w-6 rounded-lg border border-rose-600/20 text-rose-600 hover:bg-rose-600/10 transition text-xs font-bold leading-none">
            &times;
          </button>
        </form>
      </div>
    </div>
  </div>
</th:block>
</body>
</html>
