name: Java Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configurar el JDK 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 3. Configurar Node.js (requerido para compilar el CSS de Tailwind en el backend)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    # 4. Instalar dependencias de npm en el backend
    - name: Install backend npm dependencies
      run: |
        cd backend
        npm install

    # 5. Dar permisos de ejecución al wrapper de Maven
    - name: Grant execute permission for mvnw
      run: chmod +x backend/mvnw

    # 6. Compilar y ejecutar las pruebas con Maven
    - name: Build and test with Maven
      run: |
        cd backend
        ./mvnw clean test
